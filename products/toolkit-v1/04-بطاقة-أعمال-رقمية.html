<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بطاقة أعمال رقمية</title>
<script>
/* ⚙️⚙️⚙️ إعداداتك — عدّل هذه الأسطر فقط ثم احفظ الملف ⚙️⚙️⚙️ */
const CONFIG = {
  name:     "أحمد المطيري",          // اسمك أو اسم النشاط
  jobTitle: "مستشار تسويق رقمي",     // المسمى الوظيفي / وصف النشاط
  emoji:    "👨‍💼",                   // صورة رمزية
  bio:      "أساعد الأنشطة الصغيرة على مضاعفة مبيعاتها عبر التسويق الذكي.",
  whatsapp: "9665XXXXXXXX",           // رقم واتساب بصيغة دولية بدون +
  phone:    "+9665XXXXXXXX",
  email:    "name@example.com",
  website:  "https://example.com",    // اترك "" لإخفاء الزر
  snapchat: "",                       // اسم المستخدم فقط، اترك "" للإخفاء
  instagram:"",                       // اسم المستخدم فقط
  x:        "",                       // اسم المستخدم فقط
  color1:   "#123c63",
  color2:   "#0a2946",
  accent:   "#c9a44a"
};
/* ⚙️⚙️⚙️ نهاية الإعدادات — لا تعدّل شيئًا بعد هذا السطر ⚙️⚙️⚙️ */
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💼</text></svg>">
<style>
  :root { --brand:#123c63; --brand2:#0a2946; --gold:#c9a44a; --bg:#f4f6f9; --ink:#1d2733; --muted:#64748b; --line:#e2e8f0; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI",Tahoma,Arial,sans-serif; background:linear-gradient(160deg,var(--brand2),var(--brand)); min-height:100vh; color:var(--ink); line-height:1.8; display:flex; align-items:center; justify-content:center; padding:20px 14px; }
  .card { width:100%; max-width:420px; background:#fff; border-radius:22px; padding:34px 26px 26px; box-shadow:0 18px 50px rgba(0,0,0,.3); text-align:center; }
  .avatar { width:92px; height:92px; margin:0 auto 12px; border-radius:50%; background:linear-gradient(135deg,var(--brand),var(--brand2)); display:flex; align-items:center; justify-content:center; font-size:2.6rem; border:3px solid var(--gold); }
  h1 { margin:0; font-size:1.4rem; color:var(--brand2); }
  .job { color:var(--gold); font-weight:800; font-size:.95rem; }
  .bio { color:var(--muted); font-size:.9rem; margin:10px 0 20px; }
  .btns { display:grid; gap:10px; }
  .btns a { display:block; padding:13px; border-radius:12px; text-decoration:none; font-weight:800; font-size:.98rem; }
  .wa { background:#1fa855; color:#fff; }
  .call { background:var(--brand); color:#fff; }
  .mail, .site, .soc { background:#eef3f8; color:var(--brand2); border:1.5px solid var(--line); }
  .save { margin-top:14px; width:100%; padding:13px; border:0; border-radius:12px; cursor:pointer; background:linear-gradient(135deg,var(--gold),#a8842f); color:#fff; font-weight:800; font-size:.98rem; font-family:inherit; }
  .share { margin-top:12px; }
  .share button { border:0; background:none; color:var(--muted); cursor:pointer; font-family:inherit; font-size:.85rem; text-decoration:underline; }
</style>
</head>
<body>

<div class="card">
  <div class="avatar" id="cfgEmoji"></div>
  <h1 id="cfgName"></h1>
  <div class="job" id="cfgJob"></div>
  <p class="bio" id="cfgBio"></p>
  <div class="btns" id="btns"></div>
  <button class="save" onclick="saveContact()">💾 احفظ جهة الاتصال في جوالك</button>
  <div class="share"><button onclick="shareCard()">🔗 شارك بطاقتي</button></div>
</div>

<script>
document.documentElement.style.setProperty('--brand', CONFIG.color1);
document.documentElement.style.setProperty('--brand2', CONFIG.color2);
document.documentElement.style.setProperty('--gold', CONFIG.accent);
document.getElementById('cfgEmoji').textContent = CONFIG.emoji;
document.getElementById('cfgName').textContent = CONFIG.name;
document.getElementById('cfgJob').textContent = CONFIG.jobTitle;
document.getElementById('cfgBio').textContent = CONFIG.bio;
document.title = CONFIG.name + ' — ' + CONFIG.jobTitle;

const btns = document.getElementById('btns');
function addBtn(cls, text, href) {
  if (!href) return;
  const a = document.createElement('a');
  a.className = cls; a.textContent = text; a.href = href;
  if (href.startsWith('http')) { a.target = '_blank'; a.rel = 'noopener'; }
  btns.appendChild(a);
}
addBtn('wa',   '📲 واتساب مباشر', 'https://wa.me/' + CONFIG.whatsapp);
addBtn('call', '📞 اتصال', 'tel:' + CONFIG.phone);
addBtn('mail', '✉️ إيميل', CONFIG.email ? 'mailto:' + CONFIG.email : '');
addBtn('site', '🌐 الموقع الإلكتروني', CONFIG.website);
addBtn('soc',  '👻 سناب شات', CONFIG.snapchat ? 'https://snapchat.com/add/' + CONFIG.snapchat : '');
addBtn('soc',  '📸 إنستقرام', CONFIG.instagram ? 'https://instagram.com/' + CONFIG.instagram : '');
addBtn('soc',  '𝕏 إكس', CONFIG.x ? 'https://x.com/' + CONFIG.x : '');

function saveContact() {
  const vcf = 'BEGIN:VCARD\nVERSION:3.0\nFN:' + CONFIG.name +
    '\nTITLE:' + CONFIG.jobTitle +
    '\nTEL;TYPE=CELL:' + CONFIG.phone +
    (CONFIG.email ? '\nEMAIL:' + CONFIG.email : '') +
    (CONFIG.website ? '\nURL:' + CONFIG.website : '') +
    '\nEND:VCARD';
  const blob = new Blob([vcf], { type: 'text/vcard' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = CONFIG.name + '.vcf';
  a.click();
}
function shareCard() {
  if (navigator.share) {
    navigator.share({ title: document.title, url: location.href });
  } else {
    navigator.clipboard.writeText(location.href);
    alert('تم نسخ رابط البطاقة');
  }
}
</script>
</body>
</html>
