<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صفحة الروابط</title>
<script>
/* ⚙️⚙️⚙️ إعداداتك — عدّل هذه الأسطر فقط ثم احفظ الملف ⚙️⚙️⚙️ */
const CONFIG = {
  name:   "متجر لمسة",              // اسم النشاط
  emoji:  "🛍️",
  bio:    "كل روابطنا في مكان واحد — تسوق، تواصل، تابعنا",
  color1: "#123c63",
  color2: "#0a2946",
  accent: "#c9a44a",
  // الروابط: [الأيقونة، النص، الرابط] — أضف أو احذف أسطرًا كما تريد
  links: [
    ["🛒", "تسوق من المتجر", "https://example.com"],
    ["📲", "اطلب عبر واتساب", "https://wa.me/9665XXXXXXXX"],
    ["📸", "تابعنا على إنستقرام", "https://instagram.com/username"],
    ["👻", "سناب شات", "https://snapchat.com/add/username"],
    ["🎵", "تيك توك", "https://tiktok.com/@username"],
    ["📍", "موقعنا على الخريطة", "https://maps.google.com/?q=الرياض"]
  ]
};
/* ⚙️⚙️⚙️ نهاية الإعدادات — لا تعدّل شيئًا بعد هذا السطر ⚙️⚙️⚙️ */
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔗</text></svg>">
<style>
  :root { --brand:#123c63; --brand2:#0a2946; --gold:#c9a44a; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI",Tahoma,Arial,sans-serif; background:linear-gradient(160deg,var(--brand2),var(--brand)); min-height:100vh; line-height:1.8; padding:40px 16px; }
  .page { max-width:460px; margin:0 auto; text-align:center; }
  .avatar { width:88px; height:88px; margin:0 auto 10px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; font-size:2.4rem; border:3px solid var(--gold); }
  h1 { color:#fff; margin:0; font-size:1.35rem; }
  .bio { color:rgba(255,255,255,.85); font-size:.92rem; margin:6px 0 24px; }
  .links a { display:flex; align-items:center; gap:12px; background:#fff; color:#1d2733; text-decoration:none; font-weight:800; padding:15px 18px; border-radius:14px; margin-bottom:12px; box-shadow:0 6px 18px rgba(0,0,0,.18); transition:transform .15s; }
  .links a:active { transform:scale(.98); }
  .links .ico { font-size:1.3rem; }
  .foot { color:rgba(255,255,255,.6); font-size:.78rem; margin-top:26px; }
</style>
</head>
<body>

<div class="page">
  <div class="avatar" id="cfgEmoji"></div>
  <h1 id="cfgName"></h1>
  <p class="bio" id="cfgBio"></p>
  <div class="links" id="links"></div>
  <p class="foot" id="cfgFoot"></p>
</div>

<script>
document.documentElement.style.setProperty('--brand', CONFIG.color1);
document.documentElement.style.setProperty('--brand2', CONFIG.color2);
document.documentElement.style.setProperty('--gold', CONFIG.accent);
document.getElementById('cfgEmoji').textContent = CONFIG.emoji;
document.getElementById('cfgName').textContent = CONFIG.name;
document.getElementById('cfgBio').textContent = CONFIG.bio;
document.getElementById('cfgFoot').textContent = '© ' + new Date().getFullYear() + ' ' + CONFIG.name;
document.title = CONFIG.name + ' — الروابط';

const box = document.getElementById('links');
CONFIG.links.forEach(([ico, text, href]) => {
  const a = document.createElement('a');
  a.href = href; a.target = '_blank'; a.rel = 'noopener';
  const i = document.createElement('span'); i.className = 'ico'; i.textContent = ico;
  const t = document.createElement('span'); t.textContent = text;
  a.appendChild(i); a.appendChild(t);
  box.appendChild(a);
});
</script>
</body>
</html>
