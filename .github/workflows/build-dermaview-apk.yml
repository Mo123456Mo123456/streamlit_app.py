name: Build DermaView APK

on:
  push:
    branches:
      - claude/dermaview-flutter-setup-92uk6b
      - main
    paths:
      - "dermaview/app/**"
      - ".github/workflows/build-dermaview-apk.yml"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "DermaView API base URL baked into the APK (leave empty for the default http://10.0.2.2:8000)"
        required: false
        default: ""

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dermaview/app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform folder
        run: flutter create . --platforms=android --project-name dermaview

      - name: Ensure camera permission in AndroidManifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <application|' "$MANIFEST"
          fi
          cat "$MANIFEST"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos || true

      - name: Build release APK
        run: |
          if [ -n "${{ github.event.inputs.api_base_url }}" ]; then
            flutter build apk --release --dart-define=DERMAVIEW_API_BASE_URL="${{ github.event.inputs.api_base_url }}"
          else
            flutter build apk --release
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dermaview-apk
          path: dermaview/app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
